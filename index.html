<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿 Kakeibo — Personal Ledger</title>
<style>
  :root {
    --paper: #ece5d3;
    --paper-dark: #e2d9c1;
    --ink: #2a2420;
    --ink-soft: #6b6153;
    --red: #a8382a;
    --red-soft: #c07a6a;
    --green: #45603d;
    --amber: #a3721f;
    --blue-soft: #d0dbe5;
    --blue-border: #92a8bf;
    --rule: #c7bc9e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(199,188,158,0.35) 28px);
  }
  .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace; }
  .shell { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 22px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  .masthead h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; font-size: 30px; margin:0; letter-spacing: 0.04em; }
  .masthead .sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.12em; text-transform: uppercase; }
  .tabbar { display:flex; gap:2px; margin-bottom: 20px; border-bottom: 1px solid var(--rule); }
  .tab-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding: 8px 14px 10px; background: var(--paper-dark); border: 1px solid var(--rule); border-bottom: none; border-radius: 6px 6px 0 0; cursor:pointer; color: var(--ink-soft); font-size: 11px; position:relative; top:1px; font-family:inherit; }
  .tab-btn.active { background: var(--paper); color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .tab-btn .jp { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 10px; opacity:0.7; }
  
  .month-nav { display:flex; align-items:center; justify-content:center; gap: 14px; margin-bottom: 20px; }
  .month-label { font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; font-size: 17px; min-width: 170px; text-align:center; }
  .icon-btn { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 5px 10px; cursor:pointer; color: var(--ink); font-size:16px; font-family:inherit; }
  .icon-btn:hover { background: var(--paper-dark); }
  
  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 18px; margin-bottom: 18px; }
  .card-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 12px; font-weight: 600; }
  
  .stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-box { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; }
  .stat-box .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-box .value { font-size: 22px; font-weight: 600; }
  .stat-box .value.pos { color: var(--green); }
  .stat-box .value.neg { color: var(--red); }
  
  .ledger-panel { position:relative; padding-left: 22px; }
  .ledger-panel::before { content:''; position:absolute; left:12px; top:2px; bottom:2px; width:1px; background: var(--red-soft); opacity:0.55; }
  .ledger-row { display:flex; align-items:center; justify-content:space-between; padding: 9px 2px; border-bottom: 1px solid var(--rule); gap: 10px; }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-main { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .ledger-cat { font-size: 12px; color: var(--ink-soft); }
  .ledger-note { font-size: 13px; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ledger-date { font-size: 11px; color: var(--ink-soft); width: 44px; flex-shrink:0; }
  .ledger-amount { font-weight: 600; flex-shrink:0; }
  
  .del-btn { background:none; border:none; cursor:pointer; color: var(--ink-soft); padding:4px 6px; flex-shrink:0; font-size:15px; font-family:inherit; }
  .del-btn:hover { color: var(--red); }
  
  .empty-state { text-align:center; padding: 26px 10px; color: var(--ink-soft); font-size: 13px; font-style: italic; }
  
  .form-row { display:flex; flex-wrap:wrap; gap: 10px; align-items:flex-end; margin: 0; }
  .field { display:flex; flex-direction:column; gap: 4px; }
  .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: bold; }
  .field input, .field select { font-family: inherit; font-size: 13px; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 3px; background: #fbf8f0; color: var(--ink); }
  .field input.num, .field select.num { font-family: ui-monospace, monospace; }
  
  .add-btn { display:inline-flex; align-items:center; justify-content:center; gap: 6px; background: var(--ink); color: var(--paper); border: none; border-radius: 3px; padding: 8px 14px; font-size: 13px; cursor:pointer; height: 33px; font-family:inherit; }
  .add-btn:hover { background: #443b33; }
  
  .hanko { width: 52px; height: 52px; border-radius: 48% 52% 51% 49%; border: 3px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 24px; transform: rotate(-8deg); flex-shrink:0; }
  .hanko-good { color: var(--green); border-color: var(--green); }
  .hanko-over { color: var(--red); border-color: var(--red); }
  .hanko-neutral { color: var(--amber); border-color: var(--amber); }
  
  .pbar-track { width:100%; height: 7px; background: var(--paper-dark); border-radius: 4px; overflow:hidden; border: 1px solid var(--rule); }
  .pbar-fill { height:100%; border-radius: 4px; transition: width 0.3s ease; }
  .budget-row { display:flex; align-items:center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .budget-row:last-child { border-bottom:none; }
  
  .settings-grid { display:grid; grid-template-columns: 1fr; gap: 16px; }
  .footer-note { text-align:center; font-size: 11px; color: var(--ink-soft); margin-top: 30px; letter-spacing: 0.04em; }

  /* New Shift Styles */
  .shift-card { background: var(--paper-dark); padding: 14px; border-radius: 4px; border: 1px solid var(--rule); margin-bottom: 14px; }
  .day-chk { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; cursor:pointer; }
  .shift-row { flex-wrap: wrap; border-radius: 4px; padding: 10px; margin-bottom: 8px; transition: all 0.2s ease; }
  .shift-virtual { background: transparent; border: 1px dashed var(--rule); opacity: 0.7; }
  .shift-completed { background: var(--paper-dark); border: 1px solid var(--ink); opacity: 1; }
  .shift-adhoc { background: var(--blue-soft); border: 1px solid var(--blue-border); opacity: 1; }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: 1fr; }
    .tab-btn { padding: 7px 9px 9px; }
    .tab-btn .label-text { display:none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div>
      <h1>家計簿 Kakeibo</h1>
      <div class="sub">Personal Ledger — saved in this browser</div>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div id="content"></div>
  <div class="footer-note">Data is saved to this browser's local storage only. Use "Download backup" in Settings to move it elsewhere.</div>
</div>

<script>
// ---------- constants ----------
const CATEGORIES = ["Food","Housing","Transport","Utilities","Entertainment","Health","Shopping","Other"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ---------- Data Migration & Initial Setup ----------
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("save failed", key, e); }
}
function uid() { return (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2); }

// Data migration: add payCycle & transportCost if missing
let rawSettings = load("kakeibo_settings", {});
if (!rawSettings.workplaces || typeof rawSettings.workplaces === 'string') {
  const oldNames = typeof rawSettings.workplaces === 'string' ? rawSettings.workplaces.split(",") : ["LAWSON"];
  rawSettings.workplaces = oldNames.map(n => ({
    id: uid(), name: n.trim(), rate: 1200, defaultIn: "17:00", defaultOut: "22:00", defaultBreak: 0, activeDays: [], payCycle: "16", transportCost: 0
  }));
  save("kakeibo_settings", rawSettings);
} else {
  let needsSave = false;
  rawSettings.workplaces.forEach(w => {
    if (!w.payCycle) { w.payCycle = "16"; needsSave = true; }
    if (w.transportCost === undefined) { w.transportCost = 0; needsSave = true; }
  });
  if (needsSave) save("kakeibo_settings", rawSettings);
}

const TABS = [
  { id: "dashboard", label: "Overview", jp: "総覧" },
  { id: "expenses", label: "Expenses", jp: "支出" },
  { id: "budget", label: "Budget", jp: "予算" },
  { id: "hours", label: "Work Hours", jp: "勤務" },
  { id: "settings", label: "Settings", jp: "設定" },
];

let state = {
  tab: localStorage.getItem("kakeibo_tab") || "hours",
  month: localStorage.getItem("kakeibo_month") || todayISO().slice(0,7),
  expenses: load("kakeibo_expenses", []),
  budgets: load("kakeibo_budgets", {}),
  workEntries: load("kakeibo_workEntries", []),
  settings: rawSettings,
  activePlaceId: localStorage.getItem("kakeibo_place") || null,
  showHiddenShifts: false
};

if (state.settings.workplaces.length > 0 && !state.settings.workplaces.find(w => w.id === state.activePlaceId)) {
  state.activePlaceId = state.settings.workplaces[0].id;
  localStorage.setItem("kakeibo_place", state.activePlaceId);
}

// ---------- utils ----------
function yen(n) { const v = Math.round(Number(n) || 0); return (v < 0 ? "-¥" : "¥") + Math.abs(v).toLocaleString("en-US"); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function monthOf(d) { return d ? d.slice(0,7) : ""; }
function formatMonth(ym) {
  if (!ym) return "";
  const [y,m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
}
function shiftMonth(ym, delta) {
  if (!ym) ym = todayISO().slice(0,7);
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function esc(s) { const d=document.createElement("div"); d.textContent=String(s==null?"":s); return d.innerHTML; }

// Updated Date Calculation based on Pay Cycle
function getPeriodDates(ym, cycle) {
  if (!ym) ym = todayISO().slice(0,7);
  const [y, m] = ym.split("-").map(Number);
  if (cycle === "1") {
    return { startD: new Date(y, m - 1, 1), endD: new Date(y, m, 0) };
  } else if (cycle === "15") {
    return { startD: new Date(y, m - 2, 15), endD: new Date(y, m - 1, 14) };
  } else {
    return { startD: new Date(y, m - 2, 16), endD: new Date(y, m - 1, 15) };
  }
}
function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// --- Work Calculation (交通費を加算するように修正) ---
function computeEntry(entry, customRate = null, transportCost = 0) {
  if (!entry || !entry.clockIn || !entry.clockOut) return { totalHours: 0, nightHours: 0, pay: 0 };
  const [inH,inM] = entry.clockIn.split(":").map(Number);
  const [outH,outM] = entry.clockOut.split(":").map(Number);
  const rate = customRate || Number(entry.rate) || 0;
  const brk = Number(entry.breakMin) || 0;

  let start = inH * 60 + inM;
  let end = outH * 60 + outM;
  if (end < start) end += 24 * 60; 

  let regMin = 0, nightMin = 0;
  for (let m = start; m < end; m++) {
    let h = Math.floor(m / 60) % 24;
    if (h >= 22 || h < 5) nightMin++; 
    else regMin++;
  }

  let remainingBreak = brk;
  if (regMin >= remainingBreak) {
    regMin -= remainingBreak;
  } else {
    remainingBreak -= regMin;
    regMin = 0;
    nightMin = Math.max(0, nightMin - remainingBreak);
  }

  const totalHours = (regMin + nightMin) / 60;
  // 給料に交通費を足す
  const pay = ((regMin / 60) * rate) + ((nightMin / 60) * rate * 1.25) + transportCost;
  
  return { totalHours, nightHours: nightMin / 60, pay };
}

function hankoHTML(status) {
  const char = status === "good" ? "良" : status === "over" ? "超" : "中";
  const cls = status === "good" ? "hanko-good" : status === "over" ? "hanko-over" : "hanko-neutral";
  return `<div class="hanko ${cls}">${char}</div>`;
}
function pbarHTML(value, max) {
  const pct = max > 0 ? Math.min(100, (value/max)*100) : 0;
  const color = (max > 0 && value > max) ? "var(--red)" : "var(--green)";
  return `<div class="pbar-track"><div class="pbar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

function getMonthExpenses() { return state.expenses.filter(x => x && monthOf(x.date) === state.month).sort((a,b)=> a.date > b.date ? 1 : -1); }

// ---------- render ----------
function render() {
  renderTabbar();
  const content = document.getElementById("content");
  if (state.tab === "dashboard") content.innerHTML = renderDashboard();
  else if (state.tab === "expenses") content.innerHTML = renderExpenses();
  else if (state.tab === "budget") content.innerHTML = renderBudget();
  else if (state.tab === "hours") content.innerHTML = renderHours();
  else if (state.tab === "settings") content.innerHTML = renderSettings();
  attachHandlers();
}

function renderTabbar() {
  document.getElementById("tabbar").innerHTML = TABS.map(t => `
    <button class="tab-btn ${state.tab===t.id?'active':''}" data-tab="${t.id}">
      <span class="label-text">${t.label}</span>
      <span class="jp">${t.jp}</span>
    </button>`).join("");
}

function monthNavHTML() {
  return `
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">‹</button>
      <span class="month-label">${formatMonth(state.month)}</span>
      <button class="icon-btn" id="nextMonth">›</button>
    </div>`;
}

function renderDashboard() {
  const monthExpenses = getMonthExpenses();
  let totalPay = 0;
  
  state.settings.workplaces.forEach(wp => {
    const { startD, endD } = getPeriodDates(state.month, wp.payCycle);
    const startStr = toISO(startD);
    const endStr = toISO(endD);
    
    const wpShifts = state.workEntries.filter(x => x && x.placeId === wp.id && x.isCompleted && x.date >= startStr && x.date <= endStr);
    totalPay += wpShifts.reduce((s,x) => s + (computeEntry(x, wp.rate, wp.transportCost).pay), 0);
  });
  
  const totalExpenses = monthExpenses.reduce((s,x)=>s+Number(x.amount),0);
  const balance = totalPay - totalExpenses;
  const budgetTotal = Object.values(state.budgets).reduce((s,v)=>s+(Number(v)||0),0);
  const status = budgetTotal > 0 ? (totalExpenses > budgetTotal ? "over" : "good") : "neutral";

  let budgetCard = budgetTotal > 0 ? `
    <div class="card">
      <p class="card-title">Budget vs Actual</p>
      ${pbarHTML(totalExpenses, budgetTotal)}
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:6px;">
        <span class="num">${yen(totalExpenses)} spent</span>
        <span class="num">${yen(budgetTotal)} budget</span>
      </div>
    </div>` : "";

  const rows = monthExpenses.length === 0
    ? `<div class="empty-state">No expenses logged this month yet.</div>`
    : monthExpenses.slice(0,6).map(x => `
      <div class="ledger-row">
        <span class="ledger-date num">${esc(x.date.slice(5))}</span>
        <div class="ledger-main"><span class="ledger-note">${esc(x.note || x.category)}</span><span class="ledger-cat">${esc(x.category)}</span></div>
        <span class="ledger-amount num">${yen(x.amount)}</span>
      </div>`).join("");

  return `
    ${monthNavHTML()}
    <div class="dash-header">
      <div class="stat-grid" style="flex:1">
        <div class="stat-box"><div class="label">Income (All Workplaces)</div><div class="value pos num">${yen(totalPay)}</div></div>
        <div class="stat-box"><div class="label">Expenses</div><div class="value neg num">${yen(totalExpenses)}</div></div>
        <div class="stat-box"><div class="label">Balance</div><div class="value num ${balance>=0?'pos':'neg'}">${yen(balance)}</div></div>
      </div>
      ${hankoHTML(status)}
    </div>
    ${budgetCard}
    <div class="card ledger-panel"><p class="card-title">Recent Entries</p>${rows}</div>`;
}

function renderExpenses() {
  const monthExpenses = getMonthExpenses();
  const catOptions = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
  const rows = monthExpenses.map(x => `
    <div class="ledger-row">
      <span class="ledger-date num">${esc(x.date.slice(5))}</span>
      <div class="ledger-main"><span class="ledger-note">${esc(x.note || x.category)}</span><span class="ledger-cat">${esc(x.category)}</span></div>
      <span class="ledger-amount num">${yen(x.amount)}</span>
      <button type="button" class="del-btn" data-del-expense="${x.id}">✕</button>
    </div>`).join("");

  return `
    ${monthNavHTML()}
    <div class="card ledger-panel">
      <p class="card-title">Add Expense</p>
      <form class="form-row" id="expForm" style="margin-bottom:20px">
        <div class="field"><label>Date</label><input type="date" id="expDate" value="${todayISO()}" required></div>
        <div class="field"><label>Category</label><select id="expCategory">${catOptions}</select></div>
        <div class="field"><label>Amount (¥)</label><input class="num" type="number" min="1" placeholder="0" id="expAmount" required></div>
        <div class="field" style="flex:1;min-width:140px"><label>Note</label><input type="text" placeholder="optional" id="expNote"></div>
        <button type="submit" class="add-btn">+ Add</button>
      </form>
      <p class="card-title">This Month</p>
      ${rows || '<div class="empty-state">Nothing recorded yet.</div>'}
    </div>`;
}

function renderBudget() {
  const monthExpenses = getMonthExpenses();
  const spentByCategory = {};
  monthExpenses.forEach(x => { spentByCategory[x.category] = (spentByCategory[x.category]||0) + Number(x.amount); });

  const rows = CATEGORIES.map(cat => {
    const b = Number(state.budgets[cat]) || 0;
    const spent = spentByCategory[cat] || 0;
    const remainText = b > 0 ? (b - spent >= 0 ? yen(b-spent)+" left" : yen(spent-b)+" over") : "no budget set";
    return `
      <div class="budget-row">
        <span class="cat-name">${cat}</span>
        <div class="bar-wrap">
          ${pbarHTML(spent, b)}
          <div class="bar-nums"><span class="num">${yen(spent)} spent</span><span class="num">${remainText}</span></div>
        </div>
        <input type="number" min="0" class="num" placeholder="budget ¥" value="${state.budgets[cat] || ''}" data-budget-cat="${cat}">
      </div>`;
  }).join("");
  return `${monthNavHTML()}<div class="card"><p class="card-title">Monthly Budget</p>${rows}</div>`;
}

function renderHours() {
  if (state.settings.workplaces.length === 0) {
    return `<div class="empty-state" style="margin-top:40px;">No workplaces setup. Go to Settings first!</div>`;
  }

  const subTabsHtml = `
    <div style="display:flex; gap:2px; margin-bottom:16px; border-bottom: 2px solid var(--ink);">
      ${state.settings.workplaces.map(w => `
        <button class="tab-btn ${state.activePlaceId === w.id ? 'active' : ''}" data-subtab="${w.id}" style="flex:1; font-size:13px; padding:10px;">
          ${esc(w.name)}
        </button>
      `).join("")}
    </div>`;

  const activeWp = state.settings.workplaces.find(w => w.id === state.activePlaceId);
  const { startD, endD } = getPeriodDates(state.month, activeWp.payCycle);
  const todayStr = todayISO();

  let displayShifts = [];
  let totalPay = 0, totalHours = 0, totalNight = 0;

  for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
    const dateStr = toISO(d);
    const dayOfWeek = d.getDay();
    
    const savedShiftsForDay = state.workEntries.filter(x => x && x.date === dateStr && x.placeId === activeWp.id);
    
    if (savedShiftsForDay.length > 0) {
      savedShiftsForDay.forEach(shift => {
        const calc = computeEntry(shift, activeWp.rate, activeWp.transportCost);
        if (shift.isCompleted) {
          totalPay += calc.pay; totalHours += calc.totalHours; totalNight += calc.nightHours;
        }
        displayShifts.push({ ...shift, calc, dayName: DAYS[dayOfWeek] });
      });
    } else {
      if (activeWp.activeDays.includes(dayOfWeek)) {
        const virtualShift = {
          id: `virtual-${dateStr}`, placeId: activeWp.id, date: dateStr,
          clockIn: activeWp.defaultIn, clockOut: activeWp.defaultOut, breakMin: activeWp.defaultBreak,
          isCompleted: false, isVirtual: true, isAdhoc: false
        };
        virtualShift.calc = computeEntry(virtualShift, activeWp.rate, activeWp.transportCost);
        displayShifts.push({ ...virtualShift, dayName: DAYS[dayOfWeek] });
      }
    }
  }

  let visibleShifts = [];
  let hiddenCount = 0;

  displayShifts.forEach(x => {
    if (x.isCompleted && x.date < todayStr) {
      if (state.showHiddenShifts) {
        visibleShifts.push(x);
      } else {
        hiddenCount++;
      }
    } else {
      visibleShifts.push(x);
    }
  });

  const toggleHiddenHtml = (hiddenCount > 0 || state.showHiddenShifts) ? `
    <div style="text-align: center; margin-bottom: 12px;">
      <button id="toggleHiddenBtn" style="background:transparent; border:1px dashed var(--rule); color:var(--ink-soft); padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer;">
        ${state.showHiddenShifts ? "🙈 過去の完了シフトを隠す" : `👁️ 過去の完了シフト (${hiddenCount}件) を表示`}
      </button>
    </div>
  ` : "";

  const ledgerRows = visibleShifts.length === 0
    ? `<div class="empty-state">No scheduled shifts to display.</div>`
    : visibleShifts.map(x => {
        let rowClass = "shift-virtual";
        if (x.isCompleted && !x.isAdhoc) rowClass = "shift-completed";
        if (x.isAdhoc) rowClass = "shift-adhoc";

        return `
        <div class="ledger-row shift-row ${rowClass}">
          <div style="display:flex; align-items:center; gap:8px; width: 100%;">
            <input type="checkbox" class="shift-done" data-id="${x.id}" data-virtual="${x.isVirtual}" data-date="${x.date}" ${x.isCompleted ? 'checked' : ''} style="transform: scale(1.3); cursor:pointer;" title="Mark as completed">
            <div style="display:flex; flex-direction:column; align-items:center; width:44px; flex-shrink:0;">
              <span class="num" style="font-size:14px; font-weight:bold; color:var(--ink);">${x.date.slice(8,10)}</span>
              <span style="font-size:10px; color:var(--ink-soft);">${x.dayName}</span>
            </div>
            <div style="display:flex; gap:4px; flex:1; align-items:center;">
              <input type="time" class="num edit-in" data-id="${x.id}" data-virtual="${x.isVirtual}" data-date="${x.date}" value="${x.clockIn || ''}" step="60" style="width:85px; padding:4px;">
              <span style="color:var(--ink-soft)">-</span>
              <input type="time" class="num edit-out" data-id="${x.id}" data-virtual="${x.isVirtual}" data-date="${x.date}" value="${x.clockOut || ''}" step="60" style="width:85px; padding:4px;">
              <input type="number" class="num edit-brk" data-id="${x.id}" data-virtual="${x.isVirtual}" data-date="${x.date}" value="${x.breakMin || 0}" step="1" style="width:50px; padding:4px;" title="Break(min)">
            </div>
            <span class="ledger-amount num" style="opacity: ${x.isCompleted ? '1' : '0.4'}">${yen(x.calc.pay)}</span>
            ${!x.isVirtual ? `<button type="button" class="del-btn" data-del-work="${x.id}">✕</button>` : `<div style="width:28px;"></div>`}
          </div>
          <div style="width:100%; text-align:right; font-size:11px; color:var(--ink-soft); margin-top:4px;">
             ${x.isAdhoc ? '<strong style="color:var(--ink);">Extra Shift</strong> | ' : ''}${x.calc.totalHours.toFixed(1)}h @ ¥${activeWp.rate}/hr${x.calc.nightHours>0?` (${x.calc.nightHours.toFixed(1)}h late)`:""}
          </div>
        </div>`;
      }).join("");

  return `
    ${monthNavHTML()}
    ${subTabsHtml}

    <div style="font-size:11px; color:var(--ink-soft); margin-bottom:12px; text-align:right;">
      * Displaying shifts from ${startD.getMonth()+1}/${startD.getDate()} to ${endD.getMonth()+1}/${endD.getDate()}
    </div>

    <div style="padding: 12px 0;">
      <p class="card-title">Calendar & Shifts (${esc(activeWp.name)})</p>
      ${toggleHiddenHtml}
      ${ledgerRows}
    </div>

    <div class="card shift-adhoc" style="margin-top: 16px;">
      <p class="card-title" style="color: var(--ink);">+ Add Single Shift (指定日に追加)</p>
      <div style="font-size:11px; color:var(--ink-soft); margin-bottom:12px;">Use this to add a shift on a specific day one by one.</div>
      <form class="form-row" id="addAdhocForm">
        <div class="field"><label>Date</label><input type="date" id="adDate" value="${todayISO()}" required></div>
        <div class="field"><label>In</label><input type="time" id="adIn" value="10:00" step="60" required></div>
        <div class="field"><label>Out</label><input type="time" id="adOut" value="15:00" step="60" required></div>
        <div class="field"><label>Break</label><input type="number" min="0" id="adBreak" value="0" step="1" class="num" style="width:60px"></div>
        <button type="submit" class="add-btn" style="background:var(--ink);">+ Add</button>
      </form>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="label">Total hours</div><div class="value num">${totalHours.toFixed(1)}h</div></div>
      <div class="stat-box"><div class="label">LATE NIGHT</div><div class="value num" style="color:var(--amber)">${totalNight.toFixed(1)}h</div></div>
      <div class="stat-box"><div class="label">Total pay</div><div class="value pos num">${yen(totalPay)}</div></div>
    </div>
    
    <div style="font-size:11px; color:var(--ink-soft); margin-bottom:12px; text-align:right;">
      * Only shifts marked with a ✅ are included in the totals. Paid end of cycle.
    </div>`;
}

function renderSettings() {
  const wpRows = state.settings.workplaces.map((w, idx) => {
    return `
      <div class="shift-card" data-wp-idx="${idx}">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
          <div class="field"><label>WORK PLACE</label><input type="text" class="wp-name" value="${esc(w.name)}"></div>
          <div class="field"><label>RATE (¥)</label><input type="number" class="wp-rate num" value="${w.rate}" style="width:100px;"></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
          <div class="field"><label>Default IN</label><input type="time" class="wp-in num" value="${w.defaultIn}" step="60"></div>
          <div class="field"><label>Default OUT</label><input type="time" class="wp-out num" value="${w.defaultOut}" step="60"></div>
          <div class="field"><label>Default BREAK(m)</label><input type="number" class="wp-brk num" value="${w.defaultBreak}" step="1" style="width:80px"></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
          <div class="field" style="width: 100%; max-width: 250px;">
            <label>PAY CYCLE (給与サイクル)</label>
            <select class="wp-cycle">
              <option value="1" ${w.payCycle === "1" ? 'selected' : ''}>1st - End of Month (1日〜月末)</option>
              <option value="15" ${w.payCycle === "15" ? 'selected' : ''}>15th - 14th (15日締め)</option>
              <option value="16" ${w.payCycle === "16" ? 'selected' : ''}>16th - 15th (15日締め/16日開始)</option>
            </select>
          </div>
          <div class="field" style="width: 100%; max-width: 150px;">
            <label>TRANSPORT (¥ / 交通費)</label>
            <input type="number" class="wp-trans num" value="${w.transportCost || 0}" placeholder="0">
          </div>
        </div>
        <div style="border-top: 1px dashed var(--rule); margin: 12px 0;"></div>
        <label style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: bold; display:block; margin-bottom:8px;">REPEAT (EVERY WEEK)</label>
        <div style="display:flex; justify-content:space-between; max-width:320px;">
          ${DAYS.map((dayName, dIdx) => `
            <label class="day-chk">
              <input type="checkbox" class="wp-day" value="${dIdx}" ${w.activeDays.includes(dIdx) ? 'checked' : ''}>
              ${dayName}
            </label>
          `).join("")}
        </div>
        <div style="text-align:right; margin-top:8px;">
          <button type="button" class="del-btn del-wp-btn" style="font-size:12px;" data-id="${w.id}">Delete Workplace</button>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <p class="card-title" style="margin:0;">SHIFT SETTINGS</p>
        <button class="add-btn" id="addWpBtn" style="font-size:11px; padding:4px 8px; height:auto;">+ New Workplace</button>
      </div>
      <div style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">
        Define your basic shift pattern here. The Working Hours tab will automatically generate calendar entries for these days.
      </div>
      <form id="wpSettingsForm">
        ${wpRows || '<div class="empty-state">No workplaces. Add one above.</div>'}
        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="add-btn" style="background:var(--green); border:1px solid #2e4029;">Save Settings</button>
        </div>
      </form>
    </div>
    <div class="card">
      <p class="card-title">Backup &amp; Restore</p>
      <div class="backup-row">
        <button class="add-btn" id="downloadBackup">Download backup</button>
        <label class="add-btn" style="cursor:pointer">
          Restore backup
          <input type="file" id="restoreInput" accept="application/json" style="display:none">
        </label>
      </div>
    </div>`;
}

// ---------- event handling ----------
function attachHandlers() {
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { 
      state.tab = btn.dataset.tab; 
      localStorage.setItem("kakeibo_tab", state.tab);
      render(); 
    };
  });
  
  const prev = document.getElementById("prevMonth");
  const next = document.getElementById("nextMonth");
  if (prev) prev.onclick = () => { 
    state.month = shiftMonth(state.month, -1); 
    localStorage.setItem("kakeibo_month", state.month);
    render(); 
  };
  if (next) next.onclick = () => { 
    state.month = shiftMonth(state.month, 1); 
    localStorage.setItem("kakeibo_month", state.month);
    render(); 
  };

  const expForm = document.getElementById("expForm");
  if (expForm) expForm.onsubmit = (e) => {
    e.preventDefault();
    state.expenses.push({ id: uid(), date: document.getElementById("expDate").value, category: document.getElementById("expCategory").value, amount: Number(document.getElementById("expAmount").value), note: document.getElementById("expNote").value.trim() });
    save("kakeibo_expenses", state.expenses); render();
  };
  
  document.querySelectorAll("[data-del-expense]").forEach(btn => btn.onclick = () => {
      if(confirm("Delete this expense?")) { state.expenses = state.expenses.filter(x => x.id !== btn.dataset.delExpense); save("kakeibo_expenses", state.expenses); render(); }
  });
  
  document.querySelectorAll("[data-budget-cat]").forEach(inp => inp.onblur = () => {
      state.budgets[inp.dataset.budgetCat] = inp.value === "" ? 0 : Number(inp.value); save("kakeibo_budgets", state.budgets);
  });

  document.querySelectorAll("[data-subtab]").forEach(btn => {
    btn.onclick = () => { 
      state.activePlaceId = btn.dataset.subtab; 
      localStorage.setItem("kakeibo_place", state.activePlaceId);
      render(); 
    };
  });

  const toggleHiddenBtn = document.getElementById("toggleHiddenBtn");
  if (toggleHiddenBtn) {
    toggleHiddenBtn.onclick = () => {
      state.showHiddenShifts = !state.showHiddenShifts;
      render();
    };
  }

  const handleShiftInteraction = (target, field, isCheckbox) => {
    const isVirtual = target.dataset.virtual === "true";
    const date = target.dataset.date;
    const val = isCheckbox ? target.checked : target.value;
    const activeWp = state.settings.workplaces.find(w => w.id === state.activePlaceId);

    let targetShiftId;

    if (isVirtual) {
      const row = target.closest('.shift-row');
      const inVal = row.querySelector('.edit-in').value;
      const outVal = row.querySelector('.edit-out').value;
      const brkVal = Number(row.querySelector('.edit-brk').value);
      const isComp = row.querySelector('.shift-done').checked;

      const newShift = {
        id: uid(), placeId: activeWp.id, date: date,
        clockIn: inVal, clockOut: outVal, breakMin: brkVal,
        isCompleted: isComp, isAdhoc: false 
      };
      
      if(field === 'isCompleted') newShift.isCompleted = val;
      if(field === 'clockIn') newShift.clockIn = val;
      if(field === 'clockOut') newShift.clockOut = val;
      if(field === 'breakMin') newShift.breakMin = Number(val);

      targetShiftId = newShift.id;
      state.workEntries.push(newShift);
    } else {
      const shift = state.workEntries.find(x => x.id === target.dataset.id);
      if (shift) {
        shift[field] = field === 'breakMin' ? Number(val) : val;
        targetShiftId = shift.id;
      }
    }

    // 交通費の自動同期処理
    if (targetShiftId && field === 'isCompleted') {
      const transportCost = Number(activeWp.transportCost) || 0;
      if (transportCost > 0) {
        if (val === true) {
          const existing = state.expenses.find(e => e.linkedShiftId === targetShiftId);
          if (!existing) {
            state.expenses.push({
              id: uid(),
              date: date,
              category: "Transport",
              amount: transportCost,
              note: `${activeWp.name} 交通費`,
              linkedShiftId: targetShiftId
            });
          }
        } else {
          state.expenses = state.expenses.filter(e => e.linkedShiftId !== targetShiftId);
        }
        save("kakeibo_expenses", state.expenses);
      }
    }

    save("kakeibo_workEntries", state.workEntries);
    render();
  };

  document.querySelectorAll(".shift-done").forEach(el => el.onchange = (e) => handleShiftInteraction(e.target, 'isCompleted', true));
  document.querySelectorAll(".edit-in").forEach(el => el.onchange = (e) => handleShiftInteraction(e.target, 'clockIn', false));
  document.querySelectorAll(".edit-out").forEach(el => el.onchange = (e) => handleShiftInteraction(e.target, 'clockOut', false));
  document.querySelectorAll(".edit-brk").forEach(el => el.onchange = (e) => handleShiftInteraction(e.target, 'breakMin', false));

  const adForm = document.getElementById("addAdhocForm");
  if (adForm) {
    adForm.onsubmit = (e) => {
      e.preventDefault();
      const adDate = document.getElementById("adDate").value;
      const activeWp = state.settings.workplaces.find(w => w.id === state.activePlaceId);
      
      state.workEntries.push({
        id: uid(), placeId: state.activePlaceId,
        date: adDate,
        clockIn: document.getElementById("adIn").value,
        clockOut: document.getElementById("adOut").value,
        breakMin: Number(document.getElementById("adBreak").value) || 0,
        isCompleted: false,
        isAdhoc: true
      });
      save("kakeibo_workEntries", state.workEntries);

      const [y, m, d] = adDate.split("-").map(Number);
      let targetMonthStr = state.month;
      const cycle = activeWp.payCycle;

      if (cycle === "1") {
        targetMonthStr = `${y}-${String(m).padStart(2, '0')}`;
      } else if (cycle === "15") {
        if (d >= 15) {
          let nextM = m + 1; let nextY = y;
          if (nextM > 12) { nextM = 1; nextY++; }
          targetMonthStr = `${nextY}-${String(nextM).padStart(2, '0')}`;
        } else {
          targetMonthStr = `${y}-${String(m).padStart(2, '0')}`;
        }
      } else {
        if (d >= 16) {
          let nextM = m + 1; let nextY = y;
          if (nextM > 12) { nextM = 1; nextY++; }
          targetMonthStr = `${nextY}-${String(nextM).padStart(2, '0')}`;
        } else {
          targetMonthStr = `${y}-${String(m).padStart(2, '0')}`;
        }
      }

      if (state.month !== targetMonthStr) {
        state.month = targetMonthStr;
        localStorage.setItem('kakeibo_month', state.month);
      }

      if (adDate < todayISO()) {
        state.showHiddenShifts = true;
      }

      alert("単発シフトを追加しました！ ✅");
      render();
    };
  }

  document.querySelectorAll("[data-del-work]").forEach(btn => {
    btn.onclick = () => {
      if (!confirm("Delete this saved shift?")) return;
      const targetId = btn.dataset.delWork;
      state.workEntries = state.workEntries.filter(x => x.id !== targetId);
      state.expenses = state.expenses.filter(x => x.linkedShiftId !== targetId); // シフト削除時に交通費も自動削除
      save("kakeibo_workEntries", state.workEntries);
      save("kakeibo_expenses", state.expenses);
      render();
    };
  });

  const addWpBtn = document.getElementById("addWpBtn");
  if (addWpBtn) {
    addWpBtn.onclick = () => {
      state.settings.workplaces.push({ id: uid(), name: "New Workplace", rate: 1000, defaultIn: "09:00", defaultOut: "17:00", defaultBreak: 60, activeDays: [], payCycle: "16", transportCost: 0 });
      render();
    };
  }

  document.querySelectorAll(".del-wp-btn").forEach(btn => {
    btn.onclick = () => {
      if(!confirm("Are you sure?")) return;
      state.settings.workplaces = state.settings.workplaces.filter(w => w.id !== btn.dataset.id);
      save("kakeibo_settings", state.settings);
      render();
    };
  });

  const wpSettingsForm = document.getElementById("wpSettingsForm");
  if (wpSettingsForm) {
    wpSettingsForm.onsubmit = (e) => {
      e.preventDefault();
      document.querySelectorAll(".shift-card").forEach((card, idx) => {
        const wp = state.settings.workplaces[idx];
        wp.name = card.querySelector(".wp-name").value || "Unnamed";
        wp.rate = Number(card.querySelector(".wp-rate").value) || 0;
        wp.defaultIn = card.querySelector(".wp-in").value;
        wp.defaultOut = card.querySelector(".wp-out").value;
        wp.defaultBreak = Number(card.querySelector(".wp-brk").value) || 0;
        wp.payCycle = card.querySelector(".wp-cycle").value || "16"; 
        wp.transportCost = Number(card.querySelector(".wp-trans").value) || 0; // 交通費の保存を修正
        
        wp.activeDays = [];
        card.querySelectorAll(".wp-day:checked").forEach(chk => wp.activeDays.push(Number(chk.value)));
      });
      save("kakeibo_settings", state.settings);
      alert("Settings Saved!");
    };
  }

  const downloadBtn = document.getElementById("downloadBackup");
  if (downloadBtn) downloadBtn.onclick = () => {
    const payload = { expenses: state.expenses, budgets: state.budgets, workEntries: state.workEntries, settings: state.settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kakeibo-backup-" + todayISO() + ".json"; a.click();
    URL.revokeObjectURL(url);
  };

  const restoreInput = document.getElementById("restoreInput");
  if (restoreInput) restoreInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.expenses) { state.expenses = data.expenses; save("kakeibo_expenses", state.expenses); }
        if (data.budgets) { state.budgets = data.budgets; save("kakeibo_budgets", state.budgets); }
        if (data.workEntries) { state.workEntries = data.workEntries; save("kakeibo_workEntries", state.workEntries); }
        if (data.settings) { state.settings = data.settings; save("kakeibo_settings", state.settings); }
        alert("Backup restored."); render();
      } catch (err) { alert("Could not read backup file."); }
    };
    reader.readAsText(file);
  };
}

render();
</script>
</body>
</html>
